name: RSS Poller — Publish Articles

on:
  # Run automatically every 6 hours
  schedule:
    - cron: '0 */6 * * *'
  # Also allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no actual publish)'
        required: false
        default: 'false'
      max_articles:
        description: 'Max articles per category per run'
        required: false
        default: '1'
      target_category:
        description: 'Target specific category (leave empty for all)'
        required: false
        default: ''

jobs:
  poll-and-publish:
    name: Fetch RSS → Generate Articles → Upload Images to R2 → Commit
    runs-on: ubuntu-latest

    permissions:
      contents: write   # needed to git push the new .md files

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 3. Install dependencies (includes @aws-sdk/client-s3)
      - name: Install dependencies
        run: npm ci

      # 4. Run the RSS poller
      - name: Run RSS Poller
        run: node scripts/rss-poller.mjs
        env:
          # AI Keys
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Cloudflare R2 — images.traveldailypost.com
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ secrets.R2_PUBLIC_URL }}
          # Runtime options
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          MAX_ARTICLES_PER_RUN: ${{ github.event.inputs.max_articles || '1' }}
          TARGET_CATEGORY: ${{ github.event.inputs.target_category || '' }}

      # 5. Commit and push newly generated markdown files
      - name: Commit new articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/posts/ scripts/seen-articles.json
          git diff --staged --quiet || git commit -m "chore(content): auto-publish $(date -u +'%Y-%m-%d %H:%M UTC') [skip ci]"
          git push
